apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path # Nutzt den standardmäßigen K3s-Speicheranbieter
  resources:
    requests:
      storage: 20Gi # Reserviert 20 Gigabyte für die TSDB-Metrikdatenbank
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-deployment
  namespace: default
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus-container
        image: prom/prometheus:latest # Offizielles Prometheus Image
        args:
          - "--config.file=/etc/prometheus/prometheus.yml"
          - "--storage.tsdb.path=/prometheus"
          - "--storage.tsdb.retention.time=30d" # Behält Daten wie im Docker-Setup für 30 Tage
          - "--web.route-prefix=/"
        ports:
        - containerPort: 9090
          name: prom-port
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus/prometheus.yml
          subPath: prometheus.yml # Verknüpft die bestehende Konfigurationsdatei
        - name: prometheus-data
          mountPath: /prometheus # Interner Pfad für die TSDB-Metriken
      volumes:
      - name: prometheus-config
        hostPath:
          path: /home/vpnuser/monitoring/prometheus/prometheus.yml # Korrigierter Pfad zur Docker-Konfigurationsdatei
      - name: prometheus-data
        persistentVolumeClaim:
          claimName: prometheus-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: default
spec:
  type: NodePort
  ports:
  - port: 9090
    targetPort: 9090
    nodePort: 32090 # Fester externer Port für das Nginx-Routing
    protocol: TCP
  selector:
    app: prometheus
