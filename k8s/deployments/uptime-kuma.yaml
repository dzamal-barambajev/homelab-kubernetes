apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uptime-kuma-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path # Nutzt den standardmäßigen K3s-Speicheranbieter
  resources:
    requests:
      storage: 2Gi # Reserviert 2 Gigabyte Speicherplatz für die SQLite-Datenbank
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma-deployment
  namespace: default
  labels:
    app: uptime-kuma
spec:
  replicas: 1 # Betreibe genau eine Instanz der Anwendung
  selector:
    matchLabels:
      app: uptime-kuma
  template:
    metadata:
      labels:
        app: uptime-kuma
    spec:
      containers:
      - name: uptime-kuma-container
        image: louislam/uptime-kuma:1 # Offizielles Uptime Kuma Docker-Image
        ports:
        - containerPort: 3001
          name: kuma-port
        volumeMounts:
        - name: kuma-data
          mountPath: /app/data # Interner Pfad im Container für die persistenten Daten
      volumes:
      - name: kuma-data
        persistentVolumeClaim:
          claimName: uptime-kuma-pvc # Verknüpfung mit dem oben definierten Speicherplatz
---
apiVersion: v1
kind: Service
metadata:
  name: uptime-kuma-service
  namespace: default
spec:
  type: NodePort # Öffnet einen sicheren, festen Port direkt auf dem Host-System
  ports:
  - port: 3001
    targetPort: 3001
    nodePort: 32001 # Nginx leitet den Traffic von außen an diesen Port weiter
    protocol: TCP
  selector:
    app: uptime-kuma
